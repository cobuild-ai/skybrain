name: 🐛 Bug Report
description: Report a reproducible problem, crash, or unexpected behavior in SkyBrain daemon
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you are running on macOS with Apple Silicon (M1/M2/M3/M4/Pro/Max) or verified environment.
  - type: textarea
    id: description
    attributes:
      label: 📝 Problem Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: dropdown
    id: macos-chip
    attributes:
      label: 💻 Apple Silicon Hardware
      options:
        - "Apple Silicon M4 / M4 Pro / M4 Max"
        - "Apple Silicon M3 / M3 Pro / M3 Max"
        - "Apple Silicon M2 / M2 Pro / M2 Max"
        - "Apple Silicon M1 / M1 Pro / M1 Max"
        - "Other / Non-Apple Silicon (CPU only)"
    validations:
      required: true
  - type: dropdown
    id: active-model
    attributes:
      label: 🧠 Active Serving Model
      options:
        - "Gemma 4 E4B Instruct (Recommended)"
        - "Gemma 2 2B Instruct"
        - "Qwen 2.5 / Coder"
        - "Phi-4 / Llama-3"
        - "Custom GGUF / MLX Model"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔄 Steps to Reproduce
      description: How can maintainers reproduce this issue step-by-step?
      placeholder: |
        1. Run `skybrain start` or `./start.sh`
        2. Send curl request to `http://127.0.0.1:8000/v1/chat/completions`
        3. See error response or daemon exit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ✨ Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Expected standard streaming completion tokens...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 📜 Daemon Runtime Logs
      description: Paste any output from `skybrain status` or `logs/daemon.log` (Do NOT include private API keys or personal paths).
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: 📋 Pre-submission Checklist
      options:
        - label: I verified that this issue is reproducible on the latest main branch.
          required: true
        - label: I searched existing issues to ensure this is not a duplicate.
          required: true
